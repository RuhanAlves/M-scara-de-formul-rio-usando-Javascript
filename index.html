<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="oi">
        <h1>FORMULÁRIO</h1>
        <form id="formulario" action="">
            <label for="">Nome</label>
            <input type="text">
            <label for="">Endereço</label>
            <input type="text" placeholder="">
            <label for="">CEP</label>
            <input type="tel" placeholder="XX.XXX-XXX" id="CEP" oninput="mascara_CEP()" maxlength="10">
            <label for="">CPF</label>
            <input type="text" placeholder="XXX.XXX.XXX-XX" id="CPF" oninput="mascara_CPF()" maxlength="14">
            <label for="">TELEFONE</label>
            <input type="tel" placeholder="(XX)XXXXX-XXXX" id="telefone" oninput=mascara_telefone() maxlength="14">
            <label for="">CNPJ</label>
            <input type="tel" placeholder="XX.XXX.XXX/XXXX-XX" id="CNPJ" oninput=mascara_CNPJ() maxlength="18">
            <button type="submit">ENVIAR</button>
        </form>
        <dialog id="mensagem">
            <h2>Formulário enviado!</h2>
            <p>Seu formulário foi enviado com sucesso.</p>
            <button onclick="mensagem.close()">Fechar</button>
        </dialog>
    </div>
    <script src="script.js"></script>
</body>

</html>
